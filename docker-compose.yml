services:
  backend:
    build: ./backend
    env_file: [.env]
    ports: ["8000:8000"]
    volumes:
      - ./backend/app/data/cache:/srv/app/data/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports: ["3000:80"]
    depends_on: [backend]
